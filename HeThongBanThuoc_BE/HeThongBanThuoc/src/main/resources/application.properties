# ===============================
# Ứng dụng
# ===============================
spring.application.name=HeThongBanThuoc

# ===============================
# Cấu hình Database — đọc từ biến môi trường, fallback cho local dev
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/he_thong_ban_thuoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:scoppy3105}
spring.datasource.password=${DB_PASSWORD:sp3105}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# ===============================
# Tắt hoàn toàn JPA/Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Email (Gmail SMTP) — đọc từ biến môi trường
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:manhhungdz3105@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ajrhzrnbnvzgstur}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ===============================
# Server
# ===============================
server.port=8080
server.address=0.0.0.0

# ===============================
# File upload
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thư mục upload — đọc từ biến môi trường, fallback cho local dev
app.upload.dir=${UPLOAD_DIR:uploads}

# ===============================
# Gemini API Key — đọc từ biến môi trường
# ===============================
gemini.api.key=${GEMINI_API_KEY:AIzaSyDp1NxYFUZvYm4cDJEVLKSeFkKMa0bl3Bg}

# ===============================
# JWT CONFIGURATION — đọc từ biến môi trường
# ===============================
# Secret key phải dài ít nhất 32 ký tự (256-bit cho HMAC-SHA256)
jwt.secret=${JWT_SECRET:PharmaCore-JWT-Secret-Key-2024-SuperStrong-AtLeast32Chars!}
# Access Token Expiration: 1 giờ (3600000 milliseconds)
jwt.access-token-expiration=3600000
# Refresh Token Expiration: 7 ngày (604800000 milliseconds)
jwt.refresh-token-expiration=604800000

# ===============================
# Spring Boot Actuator (health check for Docker / load balancers)
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# ===============================
# Rate Limiting
# ===============================
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-seconds=60
app.rate-limit.otp.max-attempts=3
