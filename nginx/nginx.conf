worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Security headers (applied to all responses) ──────────
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Hide Nginx version ────────────────────────────────────
    server_tokens off;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain application/xml;
    gzip_min_length 1000;

    # ── Upstream — Spring Boot app ────────────────────────────
    upstream pharmacore_backend {
        server pharmacore-pos-app:8080;
        keepalive 32;
    }

    # ── HTTP → redirect to HTTPS ─────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge (Certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name your-domain.com;   # ← CHANGE THIS to your actual domain

        # SSL certificates (generated by Certbot)
        ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

        # Modern SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── File upload size limit (match Spring Boot config) ──
        client_max_body_size 10M;

        # ── Proxy timeouts for SSE (AI chat streaming) ─────────
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # ── Proxy all API requests to Spring Boot ─────────────
        location /api/ {
            proxy_pass         http://pharmacore_backend;
            proxy_http_version 1.1;

            # Required headers
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE support (keep connection alive for AI chat streaming)
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── Serve uploaded product images ─────────────────────
        location /uploads/ {
            proxy_pass         http://pharmacore_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache images in browser for 7 days
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Health check (for load balancers) ─────────────────
        location /actuator/health {
            proxy_pass http://pharmacore_backend;
            access_log off;
        }

        # ── Block everything else ─────────────────────────────
        location / {
            return 404;
        }
    }
}
